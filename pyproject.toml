[project]
name = "rubricate"
version = "0.1.0"
description = "Grade paper assignments on your own machine, Gradescope style."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rubricate = "rubricate.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
extend-exclude = ["docs/spike", "samples"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
